    <!-- Critical Zero-Latency Dark Canvas for iOS Safari PWA (Eliminates White Flash) -->
    <style>
      html {
        background-color: #0B0813 !important;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        scroll-behavior: smooth;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-text-size-adjust: 100%;
      }
      body {
        background-color: #0B0813 !important;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100dvh;
        min-height: -webkit-fill-available;
        scroll-behavior: smooth;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      #root {
        min-height: 100dvh;
        min-height: -webkit-fill-available;
        background-color: #0B0813;
        display: flex;
        flex-direction: column;
      }
      #pwa-boot-shell {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #0B0813;
        z-index: 9999;
        pointer-events: none;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.75; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.04); }
      }
      .pulse-brand {
        animation: pulseGlow 1.8s ease-in-out infinite;
      }
    </style>

    <!-- Asynchronous Non-Blocking Fonts & Leaflet (Zero White Screen Delay) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'" />
    <noscript>

    </noscript>

    <link rel="preload" as="style" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" media="print" onload="this.media='all'" />
    <noscript>

  <body class="bg-[#0B0813] text-slate-100 antialiased selection:bg-[#F59E0B] selection:text-black min-h-[100dvh]" style="background-color: #0B0813;">
    <div id="root" style="min-height: 100dvh; background-color: #0B0813; display: flex; flex-direction: column;">
      <!-- Instant 0ms Native-like Dark Boot Shell (Unmounted automatically when React mounts) -->
      <div id="pwa-boot-shell">
        <div class="pulse-brand" style="display: flex; flex-direction: column; align-items: center; text-align: center; padding: 20px;">
          <svg width="56" height="68" viewBox="0 0 100 120" fill="none" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(0 0 20px rgba(245,158,11,0.3));">
            <path d="M50 4C78 4 94 14 94 36C94 76 68 104 50 114C32 104 6 76 6 36C6 14 22 4 50 4Z" fill="#171226" stroke="#F59E0B" stroke-width="4" stroke-linejoin="round"/>
            <path d="M50 16L78 28V62C78 84 62 100 50 108C38 100 22 84 22 62V28L50 16Z" fill="#581C87" fill-opacity="0.6"/>
            <path d="M50 32L64 40V56C64 68 56 78 50 82C44 78 36 68 36 56V40L50 32Z" stroke="#F59E0B" stroke-width="2.5" stroke-linejoin="round"/>
          </svg>
          <div style="margin-top: 18px; font-size: 11px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: #ffffff;">
            SECTION F
          </div>
          <div style="margin-top: 5px; font-size: 10px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #F59E0B;">
            COMMUNITY HUB
          </div>
        </div>
      </div>
    </div>
